<div class="p-6 bg-gray-50 min-h-screen">
  <div class="max-w-4xl mx-auto">
    <h2 class="text-2xl font-bold text-gray-800 mb-6">Historial de Notificaciones</h2>

    <div class="grid gap-4">
      <div *ngFor="let nota of listaNotificaciones; let i = index"
           (click)="marcarLeida(i)"
           class="relative bg-white p-5 rounded-2xl border transition-all duration-300 shadow-sm overflow-hidden cursor-pointer hover:bg-gray-50"
           [ngClass]="nota.leido ? 'border-gray-100 opacity-75' : 'border-green-200 shadow-md ring-1 ring-green-100'">
        
        <div class="flex justify-between items-start">
          <div>
            <div class="flex items-center gap-2 mb-2">
              <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider"
                    [ngClass]="nota.leido ? 'bg-gray-100 text-gray-500' : 'bg-green-100 text-green-700'">
                {{ nota.tipoLabel }}
              </span>
              <span class="text-xs text-gray-400">{{ nota.fecha }}</span>
            </div>
            <p class="text-gray-700 text-sm leading-relaxed" 
               [ngClass]="{'font-semibold': !nota.leido}">
               {{ nota.detalle }}
            </p>
          </div>

          <div class="ml-4">
            <i [class]="nota.leido ? 'fa-solid fa-check-double text-blue-400' : 'fa-solid fa-circle text-green-500 text-[10px]'"></i>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="listaNotificaciones.length === 0" class="text-center py-20">
      <i class="fa-regular fa-bell-slash text-4xl text-gray-200 mb-4"></i>
      <p class="text-gray-400">No tienes notificaciones registradas.</p>
    </div>
  </div>
</div>
