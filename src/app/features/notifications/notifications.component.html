<div class="p-6 bg-gray-50 min-h-screen">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Notificaciones</h2>
    <span class="text-xs font-medium text-gray-500 bg-gray-200 px-3 py-1 rounded-full">
      {{ listaNotificaciones.length }} Mensajes
    </span>
  </div>

  <div class="grid grid-cols-5 bg-[#22c55e] text-white p-3 rounded-t-xl font-semibold text-sm mb-1 shadow-md">
    <div class="text-center">Estado</div>
    <div class="col-span-2 px-4">Detalle</div>
    <div class="text-center">Ubicación</div>
    <div class="text-center">Fecha</div>
  </div>

  <div class="space-y-3">
    <div *ngFor="let nota of listaNotificaciones; let i = index" 
         (mouseenter)="iniciarAutoVisto(i)"
         (mouseleave)="cancelarAutoVisto(i)"
         class="grid grid-cols-5 items-center bg-white p-4 rounded-xl shadow-sm border-l-[6px] hover:shadow-md transition-all duration-500 relative"
         [ngClass]="{
           'border-red-500': !nota.leido && nota.tipo === 'critica',
           'border-yellow-400': !nota.leido && nota.tipo === 'advertencia',
           'border-blue-400': !nota.leido && nota.tipo === 'info',
           'border-cyan-400': nota.leido 
         }">
         <div class="flex justify-center">
        <div class="w-4 h-4 rounded-full transition-all duration-700"
             [ngClass]="nota.leido ? 'bg-cyan-400' : 'bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.6)]'">
        </div>
      </div>

      <div class="col-span-2 px-4 border-r border-gray-100">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-[10px] font-black uppercase tracking-widest"
                [ngClass]="{
                  'text-red-500': !nota.leido && nota.tipo === 'critica',
                  'text-yellow-600': !nota.leido && nota.tipo === 'advertencia',
                  'text-blue-500': !nota.leido && nota.tipo === 'info',
                  'text-cyan-600': nota.leido
                }">
            {{ nota.tipoLabel }}
          </span>
        </div>
        <p class="text-sm text-gray-700 leading-snug font-medium">{{ nota.detalle }}</p>
      </div>

      <div class="text-center text-sm text-gray-600 font-semibold px-2">
        <i class="fa-solid fa-location-dot mr-1 text-gray-300"></i>
        {{ nota.ubicacion }}
      </div>

      <div class="text-center text-sm text-gray-400 font-light">
        {{ nota.fecha }}
      </div>

      <button (click)="eliminarNotificacion(i)" 
              class="absolute top-2 right-3 text-gray-300 hover:text-red-500 transition-colors">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
  </div>

  <div class="text-center mt-12 mb-8">
    <div class="inline-block px-4 py-1 border border-gray-200 rounded-full">
        <span class="text-gray-400 font-bold tracking-[0.3em] text-[10px] uppercase">Estas al dia</span>
    </div>
  </div>
</div>
