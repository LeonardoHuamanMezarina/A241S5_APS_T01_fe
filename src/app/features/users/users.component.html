<div class="w-full">
  <!-- Page Header -->
  <div class="flex justify-between items-start mb-6">
    <div>
      <h2 class="text-2xl font-bold text-gray-900 mb-1">Usuarios</h2>
      <p class="text-sm text-gray-500">Gestión de usuarios del sistema</p>
    </div>
    <button class="inline-flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-medium transition-all shadow-sm hover:shadow-md hover:-translate-y-px">
      <i class="fa-solid fa-plus"></i>
      Nuevo Usuario
    </button>
  </div>

  <!-- Controls Bar -->
  <div class="flex gap-4 mb-6">
    <div class="relative w-[300px]">
      <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
      <input type="text" placeholder="Buscar por nombre, email..." class="w-full py-2.5 px-3 pl-10 border border-gray-200 rounded-md bg-white text-gray-800 outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-colors">
    </div>
    <button class="px-4 py-2 bg-white border border-gray-200 rounded-md text-gray-700 text-sm hover:bg-gray-50 transition-colors">
      Todos los roles
    </button>
  </div>

  <!-- Table Container -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
    <table class="w-full border-collapse">
      <thead>
        <tr>
          <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wide border-b border-gray-200">USUARIO</th>
          <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wide border-b border-gray-200">CONTACTO</th>
          <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wide border-b border-gray-200">ROL</th>
          <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wide border-b border-gray-200">ESTADO</th>
          <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wide border-b border-gray-200">FECHA DE REGISTRO</th>
          <th class="text-left px-6 py-4 text-xs font-semibold text-gray-500 uppercase tracking-wide border-b border-gray-200">ACCIONES</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users" class="border-b border-gray-100 last:border-b-0 hover:bg-gray-50/50 transition-colors">
          <td class="px-6 py-4 align-middle">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-sm font-semibold text-gray-700">
                {{ user.avatarText }}
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-semibold text-gray-900">{{ user.name }}</span>
                <span class="text-xs text-gray-500">{{ user.email }}</span>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 align-middle">
            <div class="flex flex-col gap-1">
              <div class="flex items-center gap-2 text-xs text-gray-600">
                <i class="fa-solid fa-phone text-gray-400 w-3.5"></i>
                <span>{{ user.phone }}</span>
              </div>
              <div class="flex items-center gap-2 text-xs text-gray-600">
                <i class="fa-regular fa-envelope text-gray-400 w-3.5"></i>
                <span>{{ user.email }}</span>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 align-middle">
            <span class="inline-block px-3 py-1 rounded-full text-xs font-medium" 
                  [ngClass]="user.role === 'Agricultor' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'">
              {{ user.role }}
            </span>
          </td>
          <td class="px-6 py-4 align-middle">
            <div class="flex items-center gap-2">
              <div class="flex items-center p-[2px] w-9 h-5 rounded-full cursor-pointer transition-colors duration-300"
                   [ngClass]="user.isActive ? 'bg-green-500' : 'bg-gray-300'"
                   (click)="toggleStatus(user)">
                <div class="w-4 h-4 bg-white rounded-full shadow-sm transform transition-transform duration-300"
                     [ngClass]="user.isActive ? 'translate-x-4' : 'translate-x-0'">
                </div>
              </div>
              <span class="text-sm font-medium" [ngClass]="user.isActive ? 'text-green-600' : 'text-gray-500'">
                {{ user.isActive ? 'Activo' : 'Inactivo' }}
              </span>
            </div>
          </td>
          <td class="px-6 py-4 align-middle">
            <span class="text-sm text-gray-600">{{ user.registrationDate }}</span>
          </td>
          <td class="px-6 py-4 align-middle">
            <div class="flex gap-2">
              <button class="w-8 h-8 rounded-md bg-gray-50 text-gray-500 flex items-center justify-center hover:bg-gray-200 hover:text-gray-800 transition-colors" title="Editar">
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
              <button class="w-8 h-8 rounded-md bg-gray-50 text-gray-500 flex items-center justify-center hover:bg-gray-200 hover:text-gray-800 transition-colors" title="Eliminar">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
